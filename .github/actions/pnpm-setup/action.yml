name: "pnpm setup"
description: "Set up pnpm + Node 24 with store caching, install workspace deps, and (by default) build @open-inspect/shared so dependents have its dist/."
inputs:
  build-shared:
    description: "Build @open-inspect/shared after install (its consumers import from dist/, not src/)."
    default: "true"
runs:
  using: "composite"
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: "24"
        cache: "pnpm"
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Build @open-inspect/shared
      if: ${{ inputs.build-shared == 'true' }}
      shell: bash
      run: pnpm --filter @open-inspect/shared build
