name: "python setup"
description: "Set up Python 3.12 with pip caching and an upgraded pip. Job runs its own `pip install -e` afterwards."
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: "3.12"
        cache: "pip"
    - name: Upgrade pip
      shell: bash
      run: python -m pip install --upgrade pip
