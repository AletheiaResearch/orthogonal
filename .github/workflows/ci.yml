name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which areas changed so language-specific jobs only run when relevant. A single
  # required "CI Success" gate (below) avoids the skipped-required-check deadlock that plain
  # workflow-level `paths:` filters cause.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      ts: ${{ steps.filter.outputs.ts }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: filter
        with:
          filters: |
            ts:
              - 'packages/shared/**'
              - 'packages/control-plane/**'
              - 'packages/web/**'
              - 'packages/ui/**'
              - 'packages/slack-bot/**'
              - 'packages/github-bot/**'
              - 'packages/linear-bot/**'
              - 'packages/tooling-configs/**'
              - 'apps/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'oxlint*'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'
            python:
              - 'packages/modal-infra/**'
              - 'packages/sandbox-runtime/**'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'

  static:
    name: Lint, Format & TypeCheck (TypeScript)
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/pnpm-setup
      - name: Format check
        run: pnpm fmt:check
      - name: Lint
        run: pnpm lint
      - name: TypeCheck
        run: pnpm run typecheck

  test:
    name: Test (TypeScript)
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0 # needed for affected-package detection
      - uses: ./.github/actions/pnpm-setup
      - name: Run unit tests (affected since base)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -n "$BASE" ] && git rev-parse --verify --quiet "${BASE}^{commit}" >/dev/null 2>&1; then
            echo "Testing packages affected since $BASE"
            pnpm --filter "...[$BASE]" run test
          else
            echo "No usable base ref; running all tests"
            pnpm -r run test
          fi

  test-integration:
    name: Test (control-plane integration)
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/pnpm-setup
      - name: Install workerd runtime dependency
        run: sudo apt-get update && sudo apt-get install -y libc++1
      - name: Run control-plane integration tests
        run: pnpm --filter @open-inspect/control-plane run test:integration

  build:
    name: Build (TypeScript)
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0 # needed for affected-package detection
      - uses: ./.github/actions/pnpm-setup
      - name: Build (affected since base)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -n "$BASE" ] && git rev-parse --verify --quiet "${BASE}^{commit}" >/dev/null 2>&1; then
            echo "Building packages affected since $BASE"
            pnpm --filter "...[$BASE]" run build
          else
            echo "No usable base ref; building all"
            pnpm -r run build
          fi

  python-sandbox-runtime:
    name: Python (sandbox-runtime)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: packages/sandbox-runtime
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/python-setup
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src/ tests/
      - name: Ruff format check
        run: ruff format --check src/ tests/
      - name: MyPy
        run: mypy src/
        continue-on-error: true # types still being added
      - name: Tests
        run: pytest tests/ -v

  python-modal-infra:
    name: Python (modal-infra)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: packages/modal-infra
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/python-setup
      - name: Install dependencies
        run: |
          pip install -e ../sandbox-runtime
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src/
      - name: Ruff format check
        run: ruff format --check src/
      - name: MyPy
        run: mypy src/
        continue-on-error: true # types still being added
      - name: Tests
        run: pytest tests/ -v

  # Single required status check. Set branch protection to require ONLY "CI Success" — it passes
  # when every job succeeded or was skipped, and fails if any failed/was cancelled. This is what
  # lets the path-filtered jobs skip without deadlocking a required check.
  ci-success:
    name: CI Success
    if: ${{ always() }}
    needs:
      - changes
      - static
      - test
      - test-integration
      - build
      - python-sandbox-runtime
      - python-modal-infra
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify required jobs
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Job results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required CI job did not succeed (result: $r)."
              exit 1
            fi
          done
          echo "All required jobs passed or were skipped."
