name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint, Format & TypeCheck (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/pnpm-setup
      - name: Format check
        run: pnpm fmt:check
      - name: Lint
        run: pnpm lint
      - name: TypeCheck
        run: pnpm run typecheck

  test:
    name: Test (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0 # needed for affected-package detection
      - uses: ./.github/actions/pnpm-setup
      - name: Run unit tests (affected since base)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -n "$BASE" ] && git rev-parse --verify --quiet "${BASE}^{commit}" >/dev/null 2>&1; then
            echo "Testing packages affected since $BASE"
            pnpm --filter "...[$BASE]" run test
          else
            echo "No usable base ref; running all tests"
            pnpm -r run test
          fi

  test-integration:
    name: Test (control-plane integration)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/pnpm-setup
      - name: Install workerd runtime dependency
        run: sudo apt-get update && sudo apt-get install -y libc++1
      - name: Run control-plane integration tests
        run: pnpm --filter @open-inspect/control-plane run test:integration

  build:
    name: Build (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0 # needed for affected-package detection
      - uses: ./.github/actions/pnpm-setup
      - name: Build (affected since base)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -n "$BASE" ] && git rev-parse --verify --quiet "${BASE}^{commit}" >/dev/null 2>&1; then
            echo "Building packages affected since $BASE"
            pnpm --filter "...[$BASE]" run build
          else
            echo "No usable base ref; building all"
            pnpm -r run build
          fi

  python-sandbox-runtime:
    name: Python (sandbox-runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: packages/sandbox-runtime
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/python-setup
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src/ tests/
      - name: Ruff format check
        run: ruff format --check src/ tests/
      - name: MyPy
        run: mypy src/
        continue-on-error: true # types still being added
      - name: Tests
        run: pytest tests/ -v

  python-modal-infra:
    name: Python (modal-infra)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: packages/modal-infra
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/python-setup
      - name: Install dependencies
        run: |
          pip install -e ../sandbox-runtime
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src/
      - name: Ruff format check
        run: ruff format --check src/
      - name: MyPy
        run: mypy src/
        continue-on-error: true # types still being added
      - name: Tests
        run: pytest tests/ -v
