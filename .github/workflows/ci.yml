name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Base for `turbo run --affected`: the PR base on pull_request, the previous commit on push.
  TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}

jobs:
  # Detect which areas changed so language-specific jobs only run when relevant. A single
  # required "CI Success" gate (below) avoids the skipped-required-check deadlock that plain
  # workflow-level `paths:` filters cause.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # dorny/paths-filter reads the PR's changed files via the GitHub API on pull_request events,
    # which needs pull-requests: read on top of the workflow-level contents: read.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ts: ${{ steps.filter.outputs.ts }}
      python: ${{ steps.filter.outputs.python }}
      landing: ${{ steps.filter.outputs.landing }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0 # paths-filter diffs against github.event.before on push; full history avoids a credentialed fetch
          persist-credentials: false
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: filter
        with:
          filters: |
            ts:
              - 'packages/shared/**'
              - 'packages/control-plane/**'
              - 'packages/web/**'
              - 'packages/ui/**'
              - 'packages/slack-bot/**'
              - 'packages/github-bot/**'
              - 'packages/linear-bot/**'
              - 'packages/tooling-configs/**'
              - 'apps/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig*.json'
              - 'oxlint*'
              - 'scripts/**'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'
            python:
              - 'packages/modal-infra/**'
              - 'packages/sandbox-runtime/**'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'
            # Landing's `next build` prerenders /blog from Payload, so its build job needs the
            # DB schema migrated. Gate the migrate step on changes that can affect that build.
            landing:
              - 'apps/landing/**'
              - 'packages/tooling-configs/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/ci.yml'

  static:
    name: Lint, Format & TypeCheck (TypeScript)
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0 # turbo --affected needs history
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
        # build-shared defaults true: type-aware oxlint (`pnpm lint`) needs @open-inspect/shared's
        # dist/, and lint runs before `turbo run typecheck` would build it.
      - name: Format check
        run: pnpm fmt:check
      - name: Lint
        run: pnpm lint
      - name: TypeCheck (affected)
        run: pnpm exec turbo run typecheck --affected

  test:
    name: Test (TypeScript)
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
        with:
          build-shared: "false"
      - name: Unit tests (affected)
        run: pnpm exec turbo run test --affected

  test-integration:
    name: Test (control-plane integration)
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
        with:
          build-shared: "false"
      - name: Install workerd runtime dependency
        run: sudo apt-get update && sudo apt-get install -y libc++1
      - name: Integration tests (affected)
        run: pnpm exec turbo run test:integration --affected

  build:
    name: Build (TypeScript)
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # @orthogonal/landing's `next build` prerenders /blog from Payload, so it needs a reachable
    # Postgres + a Payload secret at build time. Other packages' build tasks don't read these vars
    # (turbo strict mode filters them out unless a package declares them), so this is inert for them.
    services:
      postgres:
        # Pinned by digest for reproducible builds (tag kept for readability)
        image: postgres:17-alpine@sha256:979c4379dd698aba0b890599a6104e082035f98ef31d9b9291ec22f2b13059ca
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chronicles
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CHRONICLES_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/chronicles
      CHRONICLES_POSTGRES_URL_NON_POOLING: postgresql://postgres:postgres@localhost:5432/chronicles
      # Build-time only: Payload refuses to initialize without a secret. Not a real credential.
      PAYLOAD_SECRET: ci-build-secret-not-used-at-runtime
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
        with:
          build-shared: "false"
      - name: Apply landing DB migrations
        if: needs.changes.outputs.landing == 'true'
        run: pnpm --filter @orthogonal/landing run payload migrate
      - name: Build (affected)
        run: pnpm exec turbo run build --affected

  python-sandbox-runtime:
    name: Python (sandbox-runtime)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: packages/sandbox-runtime
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-setup
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src/ tests/
      - name: Ruff format check
        run: ruff format --check src/ tests/
      - name: MyPy
        run: mypy src/
        continue-on-error: true # types still being added
      - name: Tests
        run: pytest tests/ -v

  python-modal-infra:
    name: Python (modal-infra)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: packages/modal-infra
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-setup
      - name: Install dependencies
        run: |
          pip install -e ../sandbox-runtime
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src/
      - name: Ruff format check
        run: ruff format --check src/
      - name: MyPy
        run: mypy src/
        continue-on-error: true # types still being added
      - name: Tests
        run: pytest tests/ -v

  # Single required status check. Set branch protection to require ONLY "CI Success" — it passes
  # when every job succeeded or was skipped, and fails if any failed/was cancelled. This is what
  # lets the path-filtered jobs skip without deadlocking a required check.
  ci-success:
    name: CI Success
    if: ${{ always() }}
    needs:
      - changes
      - static
      - test
      - test-integration
      - build
      - python-sandbox-runtime
      - python-modal-infra
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify required jobs
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Job results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required CI job did not succeed (result: $r)."
              exit 1
            fi
          done
          echo "All required jobs passed or were skipped."
