name: Coverage

# Coverage is an informational Codecov check (not a required status), so a workflow-level paths
# filter is safe here — skipping on non-TS changes won't deadlock a required check.
on:
  push:
    branches: [main]
    paths:
      - "packages/shared/**"
      - "packages/control-plane/**"
      - "packages/ui/**"
      - "packages/slack-bot/**"
      - "packages/github-bot/**"
      - "packages/linear-bot/**"
      - "apps/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/coverage.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/shared/**"
      - "packages/control-plane/**"
      - "packages/ui/**"
      - "packages/slack-bot/**"
      - "packages/github-bot/**"
      - "packages/linear-bot/**"
      - "apps/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/coverage.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
        with:
          build-shared: "false" # turbo's ^build handles it
      # Run coverage for ALL packages (not affected-filtered) so every upload is a complete report —
      # uploading packages one-at-a-time is what causes partial/carryforward problems in Codecov.
      - name: Run coverage
        run: pnpm exec turbo run test:coverage
      # Single upload: codecov-action auto-discovers every lcov report and merges them server-side.
      # Per-package breakdown comes from the path-based components in codecov.yml, not separate uploads.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
